[package]
name = "nav_graph_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "nav_graph_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
# PC upstream jpdict-core lives in the public InstantJPDictPC repo
# (github.com/holopengin/InstantJPDictPC). Pinned to a master rev so the
# Android build is self-contained and reproducible — no side-by-side PC
# checkout required. Bump the rev when the PC side lands a change this shim
# consumes (the shim's tests fail first if the pinned rev drifts).
# Nav-only surface: no native inference stack, no C++ toolchain, no install
# prefix.
jpdict-core = { git = "https://github.com/holopengin/InstantJPDictPC.git", rev = "dd50c97b8f5a7e3b1aee9d5e2b61a1e253631d00", default-features = false }

# The unified page OCR path compiles the shared ncnn core into this shim on
# Android. The host build stays nav-only: JVM unit tests cannot load an Android
# `.so` and do not need the model stack, so `PageRecognizer` reports a clear
# "not built for host" error there.
[target.'cfg(target_os = "android")'.dependencies]
jpdict-core = { git = "https://github.com/holopengin/InstantJPDictPC.git", rev = "dd50c97b8f5a7e3b1aee9d5e2b61a1e253631d00", default-features = false, features = ["native"] }
# PageRecognizer builds a DynamicImage from the app's ARGB pixels.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
