[package]
name = "nav_graph_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "nav_graph_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
# PC upstream jpdict-core lives in the public InstantJPDictPC repo
# (github.com/holopengin/InstantJPDictPC). Pinned to a master rev so the
# Android build is self-contained and reproducible — no side-by-side PC
# checkout required. Bump the rev when the PC side lands a change this shim
# consumes (the shim's tests fail first if the pinned rev drifts).
# Nav-only surface: no native inference stack, no C++ toolchain, no install
# prefix.
jpdict-core = { git = "https://github.com/holopengin/InstantJPDictPC.git", rev = "68ed90dc0aba99bb4bd33fe959ef7185ae1b368d", default-features = false }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
