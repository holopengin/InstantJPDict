[package]
name = "nav_graph_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "nav_graph_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
# PC upstream `jpdict_core` lives in the InstantJPDictDecky repo, which is
# unpublished (no git remote), so a git dependency cannot be pinned and
# copying nav_graph.rs back is forbidden (that recreates the fork). This
# relative path assumes the two checkouts sit side by side as
# `<...>/AndroidStudioProjects/InstantJPDict` and `<...>/repos/InstantJPDictDecky`;
# it breaks on other layouts. Once the PC repo is published, switch this to
# a git dependency pinned to a rev.
# Nav-only surface (ticket pipeline-sharing/05, merged on the PC side):
# no native inference stack, no C++ toolchain, no install prefix.
jpdict_core = { path = "../../../repos/InstantJPDictDecky/accessibility_daemon/core", default-features = false }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
